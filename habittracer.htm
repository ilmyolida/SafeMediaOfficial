<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Pro | Safe Media</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="habittracer-style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1>Habit Tracker Pro</h1>
            <div class="header-icons">
                <i class="fas fa-chart-line"></i>
                <i class="fas fa-bell"></i>
            </div>
        </header>

        <div class="stats-section">
            <div class="stat-card">
                <h3>92%</h3>
                <p>Progress</p>
            </div>
            <div class="stat-card">
                <h3>7</h3>
                <p>Active Habits</p>
            </div>
            <div class="stat-card">
                <h3>24</h3>
                <p>Days Streak</p>
            </div>
        </div>

        <div class="habits-list">
            <div class="habit-item">
                <div class="habit-info">
                    <i class="fas fa-pray"></i>
                    <div>
                        <h4>Namoz</h4>
                        <p>5 vaqt / kun</p>
                    </div>
                </div>
                <div class="habit-check">
                    <i class="fas fa-check-circle completed"></i>
                </div>
            </div>
            
            <div class="habit-item">
                <div class="habit-info">
                    <i class="fas fa-book"></i>
                    <div>
                        <h4>Qur'on o'qish</h4>
                        <p>1 juz / kun</p>
                    </div>
                </div>
                <div class="habit-check">
                    <i class="fas fa-circle-notch"></i>
                </div>
            </div>
            
            <div class="habit-item">
                <div class="habit-info">
                    <i class="fas fa-dumbbell"></i>
                    <div>
                        <h4>Sport</h4>
                        <p>30 min / kun</p>
                    </div>
                </div>
                <div class="habit-check">
                    <i class="fas fa-check-circle completed"></i>
                </div>
            </div>
            
            <div class="habit-item">
                <div class="habit-info">
                    <i class="fas fa-bed"></i>
                    <div>
                        <h4>Erta uxlash</h4>
                        <p>10:00 PM</p>
                    </div>
                </div>
                <div class="habit-check">
                    <i class="fas fa-circle-notch"></i>
                </div>
            </div>
            
            <div class="habit-item">
                <div class="habit-info">
                    <i class="fas fa-water"></i>
                    <div>
                        <h4>Suv ichish</h4>
                        <p>2 litr / kun</p>
                    </div>
                </div>
                <div class="habit-check">
                    <i class="fas fa-check-circle completed"></i>
                </div>
            </div>
        </div>

        <button class="add-habit-btn">
            <i class="fas fa-plus"></i> Add New Habit
        </button>

        <div class="quote-section">
            <i class="fas fa-quote-right"></i>
            <p>"Yaxshi odat - bu sarmoya, yomon odat - bu qarz"</p>
        </div>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Stats</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script>
        // Add habit functionality
        document.querySelectorAll('.habit-check i').forEach(icon => {
            icon.addEventListener('click', function() {
                if(this.classList.contains('completed')) {
                    this.classList.remove('completed');
                    this.classList.add('fa-circle-notch');
                    this.classList.remove('fa-check-circle');
                } else {
                    this.classList.remove('fa-circle-notch');
                    this.classList.add('fa-check-circle');
                    this.classList.add('completed');
                }
            });
        });

        // Add new habit
        document.querySelector('.add-habit-btn').addEventListener('click', () => {
            const habitName = prompt("Enter habit name:");
            if(habitName) {
                const habitDesc = prompt("Enter description:");
                const newHabit = document.createElement('div');
                newHabit.className = 'habit-item';
                newHabit.innerHTML = `
                    <div class="habit-info">
                        <i class="fas fa-tasks"></i>
                        <div>
                            <h4>${habitName}</h4>
                            <p>${habitDesc || 'Daily habit'}</p>
                        </div>
                    </div>
                    <div class="habit-check">
                        <i class="fas fa-circle-notch"></i>
                    </div>
                `;
                document.querySelector('.habits-list').appendChild(newHabit);
                
                // Add click event to new habit
                newHabit.querySelector('.habit-check i').addEventListener('click', function() {
                    if(this.classList.contains('completed')) {
                        this.classList.remove('completed');
                        this.classList.add('fa-circle-notch');
                        this.classList.remove('fa-check-circle');
                    } else {
                        this.classList.remove('fa-circle-notch');
                        this.classList.add('fa-check-circle');
                        this.classList.add('completed');
                    }
                });
            }
        });
    </script>
</body>
</html>
