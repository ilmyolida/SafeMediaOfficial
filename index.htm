<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Media Official</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">

    <header>
        <div class="header-left" onclick="toggleNav()">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="header-center">
            <img src="favicon.png" alt="Logo" class="nav-logo">
            <span class="logo-text">Safe Media</span>
        </div>
        <div class="header-right">
            <i class="fa-solid fa-book-open" id="readModeBtn" title="Oqish rejimi"></i>
            <i class="fa-solid fa-sun" id="themeBtn"></i>
        </div>
    </header>

    <div id="sideDrawer" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="toggleNav()">&times;</a>
        <div class="search-box">
            <input type="text" id="mainSearch" placeholder="Search...">
            <i class="fa fa-search"></i>
        </div>
        
        <div class="drawer-content">
            <p class="section-title" data-key="apps_title">Safe Media Apps</p>
            <a href="#"><i class="fa-brands fa-google-play"></i> Habit Tracker Pro</a>
            <a href="#"><i class="fa-solid fa-square-check"></i> Life Organizer</a>
            
            <hr>
            <p class="section-title" data-key="lang_title">Languages</p>
            <div class="lang-grid">
                <button onclick="changeLang('ky')">Кыргызча</button>
                <button onclick="changeLang('uz')">O'zbekcha</button>
                <button onclick="changeLang('en')">English</button>
                <button onclick="changeLang('ru')">Русский</button>
                <button onclick="changeLang('tr')">Türkçe</button>
                <button onclick="changeLang('ar')">العربية</button>
            </div>
        </div>
    </div>

    <main id="app">
        <div class="content-header">
            <h2 id="pageTitle" data-key="home_welcome">Xush kelibsiz</h2>
        </div>
        
        <div id="postsContainer">
            <div class="loader" id="loader"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <i class="fa-solid fa-house"></i>
            <span data-key="nav_home">Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('community')">
            <i class="fa-solid fa-users"></i>
            <span data-key="nav_community">Community</span>
        </div>
        <div class="nav-item" onclick="switchTab('solutions')">
            <i class="fa-solid fa-lightbulb"></i>
            <span data-key="nav_solutions">Solutions</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <i class="fa-solid fa-circle-user"></i>
            <span data-key="nav_profile">Profile</span>
        </div>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
